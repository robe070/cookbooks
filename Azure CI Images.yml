name: CI Images-$(Build.BuildId)

trigger:
  batch: true
  branches:
    include:
      - debug/paas

pr: none

variables:
  - group: 'External IP Addresses'
  - group: 'Image Names'
  - group: 'Azure Logins'
  - name: atomic-build
    value: $False
  - name: azureUserId
    value: PowershellScriptsSP
  - name: VersionText-w16d-16-0
    value: 0
  - name: VersionText-w16d-15-0
    value: 0
  - name: VersionText-w16d-15-0j
    value: 0
  - name: VersionText-w16d-16-0j
    value: 0
  - name: VersionText-w19d-16-0
    value: 0
  - name: VersionText-w19d-16-0j
    value: 0
  - name: VersionText-w19d-15-0
    value: 0
  - name: VersionText-w19d-15-0j
    value: 0
  - name: VersionText-w22d-16-0
    value: 0
  - name: VersionText-w22d-16-0j
    value: 0
  - name: VersionText-w22d-15-0
    value: 0
  - name: VersionText-w22d-15-0j
    value: 0

jobs:
- job: Job_1
  displayName: 'Agent job : w22d-16-0'
  timeoutInMinutes: 120
  condition: and(succeeded(), or(eq(variables['Build-w22d-16-0'], 'true'), eq(variables['Build-all'], 'true')))


  pool:
    vmImage: windows-2022

  steps:
  - checkout: self
    fetchTags: false

  - task: PowerShell@2
    name: ''
    displayName: Install PS Module
    inputs:
      filePath: scripts/install-powershell-modules-azure.ps1
      errorActionPreference: continue

  - task: PowerShell@2
    name: ''
    displayName: Azure Login
    inputs:
      filePath: scripts/AzureLogin.ps1
      arguments: -CloudAccount $(azureUserId) -CloudSecret (ConvertTo-SecureString "$(clientSecret)" -AsPlainText -force)
      workingDirectory: scripts

  - task: PowerShell@2
    condition: true
    name: BuildImage
    displayName: Build Image
    timeoutInMinutes: 120
    inputs:
      filePath: scripts/bake-scalable-azure-image-pipeline.ps1
      arguments: -VersionText 'w22d-16-0-$(VersionText-w22d-16-0)' -VersionMajor 16 -VersionMinor 0 -AmazonAMIName $(Windows-2022-IMAGE-NAME) -GitBranch "$(GitBranch)" -Cloud 'Azure' -Win2012 $false -GitUserName $(GitUserName) -MaxRetry $(MaxRetry) -ExternalIPAddresses $(ExternalIPAddresses)
      workingDirectory: scripts

  - task: PowerShell@2
    name: ''
    displayName: 'Azure Resource Group Tagging'
    inputs:
      targetType: inline
      script: >-
        Write-Host "Tagging BakingDP-w22d-16-0-$(VersionText-w22d-16-0) with Usage = "test-temp"" | Out-Default | Write-Host

        Set-AzResourceGroup -Name "BakingDP-w22d-16-0-$(VersionText-w22d-16-0)" -Tag @{ Usage = "test-temp" }

  - task: PowerShell@2
    name: ''
    displayName: 'Generate: Image URL'
    inputs:
      targetType: inline
      script: >-
        Write-Host "Writing the Full Image URL $(BuildImage.ImageUrl) in the $(Build.ArtifactStagingDirectory)" | Out-Default | Write-Host

        Out-File -FilePath (Join-Path $(Build.ArtifactStagingDirectory) "w22d-16-0.txt") -InputObject $(BuildImage.ImageUrl) | Out-Default | Write-Host

        Write-Host "Full Image URL written successfully" | Out-Default | Write-Host

  - task: PowerShell@2
    name: ''
    displayName: VM Tests
    env:
        TestImageName: w22d-16-0-$(VersionText-w22d-16-0)
        TestCloudName: Azure
        AtomicBuild: $(atomic-build)
        TestVmName: Test22160$(VersionText-w22d-16-0)
    inputs:
      filePath: scripts/invoke-pester-tests.ps1
  - task: PublishTestResults@2
    displayName: Publish Test Results **/Test-*.xml
    inputs:
      testRunner: NUnit
      testResultsFiles: '**/Test-*.xml'
      testRunTitle: w22d-16-0

  - task: PublishBuildArtifacts@1
    name: ''
    displayName: 'Publish Artifact: Image URL'
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/w22d-16-0.txt
      ArtifactName: w22d-16-0
      FileCopyOptions: ''

  - task: AzureResourceManagerTemplateDeployment@3
    displayName: Delete Resource Group
    inputs:
      ConnectedServiceName: $(ConnectedServiceName)
      subscriptionName: 739c4e86-bd75-4910-8d6e-d7eb23ab94f3
      action: DeleteRG
      resourceGroupName: BakingDP-w22d-16-0-$(VersionText-w22d-16-0)

