variables:
  - group: 'External IP Addresses'
  - group: 'Image Names'
  - group: 'Azure Logins'

  - name: azureUserId
    value: PowershellScriptsSP

  - name: vmImage
    value: windows-2022

  - name:  TestCloudName
    value: 'Azure'

  - name: AtomicBuild
    value: $False

  - name: ScriptTimeout
    value: 360

jobs:

- template: AzureDevOps/templates/AzureBuildAllImages.yml
  parameters:
    VersionText: "$(VersionText )"  # Quotes are important as at this point $(VersionText) is undefined)
    ScriptTimeout: ${{ variables.ScriptTimeout }}

