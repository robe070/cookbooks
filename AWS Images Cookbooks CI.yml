name: AWS-Images-CI-$(Build.BuildId)
trigger: none
variables:
  - group: "External IP Addresses"
  - group: "ImageVersion"
  - group: "Logins"
  - group: "AWS base AMI Image Names"
  - group: "Agents"
  - name: atomic-build
    value: $false
  - name: atomic-build-ps
    value: $false
  - name: quickstart-scripts
    value: $(Agent.BuildDirectory)\test
  - name: regionName
    value: ap-southeast-2
  - name: agentVMImage
    value: Default
  - name: VersionText
    value: 0

jobs:

- job: Job_1
  displayName: 'Agent job : w25d-16-0'
  timeoutInMinutes: 360
  condition: and(succeeded(), or(eq(variables['Build-w25d-16-0'], 'True'), eq(variables['Build-V16'], 'True'), eq(variables['Build-w25d'], 'True')))
  pool:
    name: $(agentVMImage)
  steps:
  - checkout: self

  - task: PowerShell@2
    displayName: Install PowerShell Modules
    inputs:
      filePath: scripts/install-powershell-modules.ps1

  - task: DownloadSecureFile@1
    name: keypair
    displayName: Download KeyPair
    inputs:
      secureFile: AzureDevOps.pem

  - task: AmazonWebServices.aws-vsts-tools.AWSPowerShellModuleScript.AWSPowerShellModuleScript@1
    name: BuildImage
    displayName: Build Image
    inputs:
      awsCredentials: $(awsCredentials)
      regionName: $(regionName)
      arguments: " -VersionText 'w25d-16-0-$(VersionText)' -VersionMajor 16 -VersionMinor 0 -AmazonAMIName $(windows-2025-AMI) -GitBranch \"$(GitBranch)\" -Cloud 'AWS' -Win2012 $false -KeyPairName $(KeypairName) -KeyPairPath $(keypair.secureFilePath) -GitUserName $(GitUserName) -MaxRetry $(MaxRetry) -RunWindowsUpdates $(RunWindowsUpdates) -ExternalIPAddresses  $(ExternalIPAddresses)"
      filePath: scripts/bake-scalable-azure-image-pipeline.ps1

  - task: PowerShell@2
    displayName: 'Generate: AMI Id'
    inputs:
      targetType: inline
      script: >-
          Write-Host "Writing the Full Image URL $(BuildImage.amiID) in the $(Build.ArtifactStagingDirectory)" | Out-Default | Write-Host

          Out-File -FilePath (Join-Path $(Build.ArtifactStagingDirectory) "w25d-16-0.txt") -InputObject $(BuildImage.amiID) | Out-Default | Write-Host

          Write-Host "Full Image URL written successfully" | Out-Default | Write-Host

  - task: AmazonWebServices.aws-vsts-tools.AWSPowerShellModuleScript.AWSPowerShellModuleScript@1
    name: Vmtest
    displayName: VM Tests
    env:

        TestImageName: $(BuildImage.amiID)
        TestCloudName: AWS
        AtomicBuild: $(atomic-build)
        TestVmName: T16142$(VersionText)
        SG: w25d-16-0-$(VersionText)
        keypair: $(KeypairName)
        keypairpath: $(keypair.secureFilePath)
        SkuName: w25d-16-0-$(VersionText)
    inputs:
      awsCredentials: $(awsCredentials)
      regionName: $(regionName)
      filePath: scripts/invoke-pester-tests.ps1

  - task: PublishTestResults@2
    displayName: Publish Test Results **/Test-*.xml
    inputs:
      testRunner: NUnit
      testResultsFiles: '**/Test-*.xml'
      testRunTitle: w25d-16-0

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: Image URL'
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/w25d-16-0.txt
      ArtifactName: aws
      FileCopyOptions: ''

  - task: AmazonWebServices.aws-vsts-tools.AWSPowerShellModuleScript.AWSPowerShellModuleScript@1
    displayName: 'Deleting Security group and Instance '
    inputs:
      awsCredentials: $(awsCredentials)
      regionName: $(regionName)
      arguments: -versionText '$(VersionText)' -version 'w25d-16-0'
      filePath: scripts/terminate-instance.ps1

- job: Job_2

  displayName: 'Agent job : w25d-15-0'
  timeoutInMinutes: 360
  condition: and(succeeded(), or(eq(variables['Build-w25d-15-0'], 'True'), eq(variables['Build-V15'], 'True'), eq(variables['Build-w25d'], 'True')))
