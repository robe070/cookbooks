trigger: none

resources:
  pipelines:
    - pipeline: _Build Image Release Artefacts
      source: 'Build Image Release Artefacts  3.0'

  repositories:
    - repository: _robe070_cookbooks
      type: github
      endpoint: robe070
      name: robe070/cookbooks
      ref: debug/paas

    - repository: _lansa_aws-templates
      type: github
      endpoint: robe070
      name: lansa/aws-templates
      ref: support/scalable

variables:
  - group: Template Parameters
  - group: Default Branch
  - group: S3 uploads
  - group: VPC ap-southeast-2
  - group: VPC us-east-1
  - group: Git Repos
  - group: Agents
  - name: ArtifactSourceAlias
    value: _lansa_aws-templates
  - name: CookbooksSource1
    value: c:\lansa
  - name: imageReleaseState
    value: Production
  - name: jpnLanguage
    value: JPN
  - name: stackname
    value: BakingDP-ImageRelease
  - name: TemplateS3Namespace
    value: /image-cd-pipeline
  - name: agentVMImage
    value: Default

stages:
- stage: StartVMs
  displayName: Start VMs
  jobs:
  - template: AzureDevOps/templates/start-agents.yml
    parameters:
      resourceGroup: $(agentResourceGroup)
      baseVmName: $(agentBaseVmName)
      vmCount: 12
      azureSubscription: 'Azure Baking Images'

- stage: Init
  displayName: Initialise
  dependsOn: StartVMs
  jobs:
    - job: Init
      displayName: Initialise
      timeoutInMinutes: 0
      cancelTimeoutInMinutes: 1

      pool:
        name: $(agentVMImage)

      steps:
        - template: AzureDevOps/templates/AWSInitRepos.yml

        - powershell: |
            $env:Path = "C:\Program Files\Amazon\AWSCLIV2;$env:Path"
            aws --version
          displayName: 'Check AWS CLI version'

        - task: PowerShell@2
          displayName: 'Delete temp branch and create temp branch'
          inputs:
            targetType: filePath
            filePath: '$(Pipeline.Workspace)/_lansa_aws-templates/scripts/DeleteTempBranchAndCreatetempBranch.ps1'
            arguments:
              -GitBranch '$(GitLansaAwsTemplatesTempBranch)'
              -GitRepoName '$(ArtifactSourceAlias)'

        - task: PowerShell@2
          name: Vars
          displayName: 'Set stageDependencies Version variables based on the published artefacts'
          inputs:
            targetType: filePath
            filePath: 'cookbooks/scripts/SetVersionVariables.ps1'

        - template: AWSValidateTemplates.yml@_lansa_aws-templates
          parameters:
            sourceFolder: '$(Pipeline.Workspace)/_lansa_aws-templates/CloudFormationWindows'
            targetFolder: 'templates/$(CookbooksBranch)$(TemplateS3Namespace)'

        - task: AmazonWebServices.aws-vsts-tools.AWSCLI.AWSCLI@1
          displayName: 'AWS Delete the AMI ids from s3'
          inputs:
            awsCredentials: AzureDevOps
            regionName: 'ap-southeast-2'
            awsCommand: s3
            awsSubCommand: rm
            awsArguments: 's3://lansa/templates/support/scalable/ami-list/ --recursive'
            failOnStandardError: false

- stage: ShowVars
  displayName: Show Variables
  dependsOn: Init
  variables:
  - template: AzureDevOps/templates/vars.yml

  jobs:
  - job: ShowVars
    displayName: Show Variables
    pool:
      name: $(agentVMImage)
    steps:
      - task: PowerShell@2
        displayName: 'Show All Variables'
        inputs:
          targetType: inline
          script: |
            Write-Host "Show all variables:"
            Get-ChildItem Env:

