- stage: Test
  displayName: Test
  condition: succeededOrSkipped()
  dependsOn:
    - w19d150CopyAMItoUS
    - w19d160jUSIMGTest
    - w19d150jCopyAMItoUS

  jobs:
    - job: Test
      displayName: Test
      pool: server
      timeoutInMinutes: 43200
      steps:

        - powershell |
            Write-Host "Print Version Variable value = $(Version)"

- stage: Marketplace
  displayName: Marketplace
  condition: succeededOrSkipped() # Ensure that even if any of the dependent stages listed below are skipped, this stage will still run.
  # Note These dependencies have 2 roles. As well as the basic idea of making this stage dependent on the successful completion of the previous stages, it also ensures that the Stage variable 'version' that is used as $(Gate.Version) in the dependent Stages, is 'copied' into this stage as $(Version). Any and all stages that actually execute (condition = true) will set $(Gate.Version). All are using the same value, so it doesn't matter which one is used.
  # $(version) is used in the 'Tag cookbooks repo' Task.
  dependsOn:
    - w25d160USIMGTest
    - w25d150USIMGTest
    - w25d160jUSIMGTest
    - w25d150jUSIMGTest
    - w19d160USIMGTest
    - w19d150USIMGTest
    - w19d160jUSIMGTest
    - w19d150jUSIMGTest
    - w22d160USIMGTest
    - w22d150USIMGTest
    - w22d160jUSIMGTest
    - w22d150jUSIMGTest

  jobs:
    - job: Marketplace
      displayName: Pause for Marketplace
      pool: server
      timeoutInMinutes: 43200
      steps:

        - task: ManualValidation@1
          displayName: 'Marketplace Instructions'
          timeoutInMinutes: 43200
          inputs:
            instructions: |
              1. Manual step. Submit US AMIs to AWS MP. Upload the AMIs to AWS Markeplace.
              a. In N. Virginia, find date that is in the name that all the AMIs of this release share
              b. Go to AWS MP, Assets, AMI and Add AMI. Enter the date from the AMI Name.
              c. select all the images. 8? Click Next and enter the Role : arn:aws:iam::775488040364:role/AWS-Marketplace-Ingestion
              d. Click through, taking all the defaults
              2. Manually update a copy of the Product Load Form (today's date in the name) with the US AMIs.
              b. Pull the latest aws-templates support/scalable branch and check that all the AMis in the diff are in the PLF
              3. Increment the Version Numbers in the Build Image Release Artefacts CI pipeline
              4. Increment the VersionText-TemplateCI variable for the Template CI pipeline testing
            onTimeout: 'reject'

- stage: TagGit
  displayName: Tag Git
  jobs:
    - job: Tag Git
      displayName: Tag Git
      timeoutInMinutes: 0
      cancelTimeoutInMinutes: 1

      pool:
        name: $(agentVMImage)

      steps:
        - template: AzureDevOps/templates/AWSInitRepos.yml
          parameters:
            gitRepoBranch: '$(CookbooksBranch)'
            gitHubName: '$(GitCookBooksGitHubName)'
            gitRepoPath: '$(CookbooksSourceAlias)'

        # - task: AmazonWebServices.aws-vsts-tools.AWSPowerShellModuleScript.AWSPowerShellModuleScript@1
