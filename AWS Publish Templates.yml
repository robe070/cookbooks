- stage: WaitForLive
  displayName: Wait For Live
  dependsOn:
  - ParisPrevieww25d_16_0
  - OregonPrevieww25d_15_0
  - TokyoPrevieww19d_16_0
  - N_Virginia_Preview_w19d_15_0
  - LondonPreview_w19d_15_0j
  - N_CaliforniaPreview_w25d_16_0j
  - MumbaiPreview_w19d_16_0j
  - HongKongPreview_w25d_15_0j
  jobs:
  - job: Job_1
    displayName: 'Agentless Job'
    pool: server
    timeoutInMinutes: 43200
    steps:
    - task: ManualValidation@1
      displayName: 'Manual Intervention : Merge & Go Live'
      timeoutInMinutes: 43200
      inputs:
        instructions: |
          Preview tests have completed successfully.
          Ready to go live.
          Merge cookbooks patch/paas to support/scalable
          Click the button to go live.
          Note that once the first template has been published that there is no preview stage. Its live straightaway. When/if that occurs, only the merge is required, then this stage can be continued. Consideration should be made of moving this Stage merge before the "Marketplace URL tests" and doing the merge then.

- stage: MergeAndTag
  displayName: Merge & Tag
  dependsOn:
    - WaitForLive
    - Init

  variables:
  - template: AzureDevOps/templates/vars.yml
    parameters:
      isImageType: EITHER

  jobs:
  - job: Job_1
    displayName: 'Dev Stack'
    timeoutInMinutes: 120
    pool:
      name: $(agentVMImage)
    steps:
      - template: AzureDevOps/templates/AWSInitRepos.yml
        parameters:
          gitRepoBranch: $(CookbooksBranchPreview)
          gitHubName: $(GitCookbooksGitHubName)
          gitRepoPath: $(CookbooksSourceAlias)
          checkoutTemplateMPRepo: true

      # - task: AmazonWebServices.aws-vsts-tools.AWSPowerShellModuleScript.AWSPowerShellModuleScript@1
      #   name: Gate
      #   displayName: 'Artifact Check : Set Gate Variable'
      #   inputs:
      #     awsCredentials: $(awsCredentials)
      #     regionName: $(RegressionTestRegion)
      #     filePath: '$(Pipeline.Workspace)/_lansa_aws-templates/scripts/SetGateVariable.ps1'
      #     arguments:
      #       -BaseImageName 'w19d-15-0'
      #       -stackname 'w19d-15-0-IMG'

      - powershell: |
          # Print the Gate variables.
            Write-Host "IsEnabled: $(IsEnabled); ImageID: $(ImageID); version:$(version); VersionDigits:$(VersionDigits); stack:$(stack)"
        displayName: 'Artifact Check : Output Image Variables'

      - task: PowerShell@2
        displayName: 'Merge robe070/cookbooks repo patch/paas to support/scalable'
        inputs:
          targetType: filePath
          filePath: '$(Pipeline.Workspace)/_robe070_cookbooks/scripts/GitMerge.ps1'
          arguments:
            -GitRepoPath '$(CookbooksSourceAlias)'
            -GitSourceBranch '$(CookbooksBranchPreview)'
            -GitTargetBranch '$(CookbooksBranchProduction)'

      - task: PowerShell@2
        displayName: 'Write access to Templates Marketplace Branch'
        inputs:
          targetType: filePath
          filePath: '$(Pipeline.Workspace)/_lansa_aws-templates-mp/scripts/GitRepoWriteAccess.ps1'
          arguments:
            -GitBranch '$(GitLansaAwsTemplatesMarketPlaceBranch)'
            -GitURL 'https://$(GitLansaAwsTemplatesPAT):x-oauth-basic@$(GitLansaAwsTemplatesGitHubName)'
            -GitUserEmail '$(GitRepoUserEmail)'
            -GitUserName '$(GitRepoUserName)'
            -GitRepoPath '$(GitLansaAwsTemplatesRepoName)'

      - task: PowerShell@2
        displayName: 'Tag Templates Marketplace Branch'
        inputs:
          targetType: filePath
          filePath: '$(Pipeline.Workspace)/_lansa_aws-templates-mp/scripts/GitTag.ps1'
          arguments:
            -GitRepoPath '$(GitLansaAwsTemplatesRepoName)'
            -Tags 'AWSTemplate-Bld-$(Build.BuildId)-$(Release.ReleaseName)-$(VersionDigits)-mp'

      - task: PowerShell@2
        displayName: 'Write access to Templates Support Branch'
        inputs:
          targetType: filePath
          filePath: '$(Pipeline.Workspace)/_lansa_aws-templates/scripts/GitRepoWriteAccess.ps1'
          arguments:
            -GitBranch '$(GitLansaAwsTemplatesBranch)'
            -GitURL 'https://$(GitLansaAwsTemplatesPAT):x-oauth-basic@$(GitLansaAwsTemplatesGitHubName)'
            -GitUserEmail '$(GitRepoUserEmail)'
            -GitUserName '$(GitRepoUserName)'
            -GitRepoPath '$(GitLansaAwsTemplatesSupportRepoName)'

      - task: PowerShell@2
        displayName: 'Tag Templates Support Branch'
        inputs:
          targetType: filePath
          filePath: '$(Pipeline.Workspace)/_lansa_aws-templates/scripts/GitTag.ps1'
          arguments:
            -GitRepoName '$(GitLansaAwsTemplatesSupportRepoName)'
            -Tags 'AWSTemplate-Bld-$(Build.BuildId)-$(Release.ReleaseName)-$(VersionDigits)'

