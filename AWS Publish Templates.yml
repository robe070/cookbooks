- stage: MergeToMarketplaceAndUpload
  displayName: Merge To Marketplace & Upload
  dependsOn:
    - AUSSmallShoeSizew25d_16_0
    - AUSTestShoeSizew25d_15_0
    - AUSDevShoeSizew19d_16_0
    - AUSVPCTestsw19d_15_0
    - AUSMediumShoeSizew25d_16_0j
    - AUSLargeShoeSizew25d_15_0j
    - AUSUpdateScriptsFALSEw19d_16_0j
    - AUSJPNVPCTestsw19d_15_0j
  jobs:
  - job: Job_1
    displayName: Merge To Marketplace & Upload
    pool:
      name: $(agentVMImage)
    steps:
      - template: AzureDevOps/templates/AWSInitRepos.yml
        parameters:
          gitRepoBranch: $(GitLansaAwsTemplatesMarketPlaceBranch)
          gitHubName: $(GitLansaAwsTemplatesGitHubName)
          gitRepoPath: $(GitLansaAwsTemplatesRepoName)
          downloadImageArtefacts: false
          checkoutTemplateRepo: false
          checkoutTemplateMPRepo: true

      - task: PowerShell@2
        displayName: 'Merge support/scalable into support/scalable_marketplace'
        inputs:
          targetType: filePath
          filePath: '$(Pipeline.Workspace)/_robe070_cookbooks/scripts/GitMerge.ps1'
          arguments:
            -GitRepoPath '$(GitLansaAwsTemplatesRepoName)'
            -GitSourceBranch '$(GitLansaAwsTemplatesBranch)'
            -GitTargetBranch '$(GitLansaAwsTemplatesMarketPlaceBranch)'

      - task: AmazonWebServices.aws-vsts-tools.S3Upload.S3Upload@1
        displayName: 'S3 Upload to support/scalable'
        inputs:
          awsCredentials: AzureDevOps
          regionName: 'ap-southeast-2'
          bucketName: 'lansa'
          sourceFolder: '$(Pipeline.Workspace)/_lansa_aws-templates-mp/CloudFormationWindows'
          globExpressions: '*.template'
          targetFolder: 'templates/$(CookbooksBranchProduction)'
          filesAcl: 'public-read'

      # - task: AmazonWebServices.aws-vsts-tools.AWSPowerShellModuleScript.AWSPowerShellModuleScript@1
      #   displayName: 'Update Templates In Marketplace'
      #   inputs:
      #     awsCredentials: AzureDevOps
      #     regionName: 'us-east-1'
      #     filePath: '$(Pipeline.Workspace)/_lansa_aws-templates-mp/scripts/UpdateTemplatesInMarketplace.ps1'
      #     arguments: -Version '15.0.19'

- template: AzureDevOps/templates/AWSTestTemplate.yml
  parameters:
    deploymentType: Preview
    templateSource: s3                            # Note that this is after the system testing but before actual preview to test that the templates we've uploaded are correct
    stageName: ValidateTemplateURLs
    stagedisplayName: Validate Template URLs
    dependsOn: MergeToMarketplaceAndUpload
    jobName: SmallStack
    jobDisplayname: 'Small Stack'
    baseImageName: w25d-16-0
    stackName: AUS-Small
    paramStackType: Small
    paramLansaMSIKey: $(msiURLv16)
    param10LansaGitRepoBranch: $(CookbooksBranchPreview)
    paramCreateVPC: 'Yes'

- stage: AddVersionToMarketplace
  displayName: Add Version To Marketplace
  dependsOn:
      - Init
      - ValidateTemplateURLs
  variables:
    - template: AzureDevOps/templates/vars.yml
      parameters:
        isImageType: EITHER
  jobs:
  - job: AddVersion
    displayName: Add Version To Marketplace
    pool:
      name: $(agentVMImage)
    steps:
      - template: AzureDevOps/templates/AWSInitRepos.yml
        parameters:
          gitRepoBranch: $(GitLansaAwsTemplatesMarketPlaceBranch)
          gitHubName: $(GitLansaAwsTemplatesGitHubName)
          gitRepoPath: $(GitLansaAwsTemplatesRepoName)
          downloadImageArtefacts: true
          checkoutTemplateRepo: false
          checkoutTemplateMPRepo: true

      - task: AmazonWebServices.aws-vsts-tools.AWSPowerShellModuleScript.AWSPowerShellModuleScript@1
        displayName: 'Add new version to Marketplace Products'
        name: vars
        inputs:
          awsCredentials: AzureDevOps
          regionName: 'us-east-1'
          filePath: '$(Pipeline.Workspace)/_lansa_aws-templates-mp/scripts/UpdateTemplatesInMarketplace.ps1'
          arguments: '-VersionDigits $(VersionDigits)'

- stage: VersionAlreadyExists
  displayName: 'Possible build failure - Version already exists'
  dependsOn: AddVersionToMarketplace
  variables:
  - name: MarketPlaceUpdateInterventionRequired
    value: $[stageDependencies.AddVersionToMarketplace.AddVersion.outputs['vars.MarketPlaceUpdateInterventionRequired']]

  jobs:
  - job: 'Job_1'
    displayName: 'Check why the Version already exists'
    pool: server
    timeoutInMinutes: 43200
    condition: and(succeeded(), ne(variables.MarketPlaceUpdateInterventionRequired, 'False')) # This pipeline variable is set in UpdateTemplatesInMarketplace.ps1 if the publication process must be restarted.
    steps:
    - task: ManualValidation@1
      displayName: 'Version already exists - New Version must be created'
      timeoutInMinutes: 43200
      inputs:
        instructions: |
          The version already exists. Is this expected? If either the AMI or the templates have been updated, VersionDigits MUST BE INCREMENTED in Build Image Release Artefacts pipeline and all appropriate pipelines re-run. That is, a NEW VERSION is required in order to update the AMI or templates. This is only usually OK when the pipeline itself has been modified but no changes have been made to the AMI or templates.
          1. If a new version is required, REJECT this Task and re-run the Build Image Release Artefacts pipeline with an incremented VersionDigits variable. Then re-run this pipeline.
          2. If this is expected, click RESUME on this Task.

- stage: CheckTemplatesAndAMIHaveBeenUpdatedInAWSMP
  displayName: 'Check templates and AMI have been updated in AWS MP'
  dependsOn: AddVersionToMarketplace
  variables:
  - name: MarketPlaceUpdateInterventionRequired
    value: $[stageDependencies.AddVersionToMarketplace.AddVersion.outputs['vars.MarketPlaceUpdateInterventionRequired']]

  jobs:
  - job: 'Job_1'
    displayName: 'Check templates and AMI have been updated in AWS MP'
    pool: server
    timeoutInMinutes: 43200
    condition: and(succeeded(), eq(variables.MarketPlaceUpdateInterventionRequired, 'False')) # This pipeline variable is set in UpdateTemplatesInMarketplace.ps1 if the publication process must be restarted.
    steps:
    - task: ManualValidation@1
      displayName: 'Manual Intervention : Check MP templates and AMI'
      timeoutInMinutes: 43200
      inputs:
        instructions: |
          1. Check that the templates have been uploaded at a time consistent with when the pipeline ran. https://lansa.s3.ap-southeast-2.amazonaws.com/templates/support/scalable.
          2. Check that a new Version ending in the appropriate VersionDigits has been added to each Marketplace product
             - Go to https://aws.amazon.com/marketplace/management/products/server?#
             - Click on the product
             - List the requests and check the last version added for each product ends with the correct digits and the AMI ID is the expected one. The expected AMI ID can be found in the output of the Init stage of this pipeline.
          3. If the version has been added and the AMI ID is correct, for all products built by the Build Image Release Artefacts pipeline, then click RESUME on this Task. Otherwise REJECT this Task.
          4. Note that any changes to the templates or AMIs will require a new version to be created using the Build Image Release Artefacts pipeline.

