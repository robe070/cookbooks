# Note that the Templates are all tested with the same AMI which is derived from the latest built images.
# Only a subset of the images are built, so a search is made for the first build image and uses that.
# It is sorted on descending filename, and thus the most recent Windows OS and most recent Lansa version is used.
# The corollary of that is that specific images are not used. Therefore where stages specify a specific version
# e.g. w19d-16-0, this is irrelevant. The names have not been changed because uniqueness is required. The baseName is
# used but only the last character - if its 'j' then a Japanese image will be used, otherwise an English image will be used.
# Also note that the critical gateway stage ValidateTemplateURLs requires an English image and will fail if one does not exist.
# That could be changed to have 2 tasks, one which uses an English image and one that uses a Japanese image, and just run one of them.
resources:
  pipelines:
  - pipeline: _Build Image Release Artefacts
    source: 'Build Image Release Artefacts  3.0'

  repositories:
  - repository: _lansa_aws-templates
    type: github
    endpoint: robe070
    name: lansa/aws-templates
    ref: $(GitLansaAwsTemplatesBranch)

  - repository: _lansa_aws-templates-mp
    type: github
    endpoint: robe070
    name: lansa/aws-templates
    ref: $(GitLansaAwsTemplatesMarketPlaceBranch)

  - repository: _robe070_cookbooks
    endpoint: robe070
    type: github
    name: robe070/cookbooks
    ref: $(CookbooksBranch)

variables:
  - name: CookbooksSource
    value: $(Build.Repository.LocalPath)\cookbooks
  - name: ArtifactSourceAlias
    value: _lansa_aws-templates
  - name: CookbooksSource1
    value: c:\lansa
  - name: jpnLanguage
    value: JPN
  - name: LansaReleaseTemplateUrl
    value: https://raw.githubusercontent.com/lansa/aws-templates/support/scalable/CloudFormationWindows/lansa-master-win.cfn.template
  - name: RegressionTestRegion
    value: ap-southeast-2
  - name: agentVMImage
    value: Default

  - group: "Template Parameters"
  - group: "VPC ap-southeast-2"
  - group: "VPC us-east-1"
  - group: "VPC us-west-1"
  - group: "VPC us-west-2"
  - group: "VPC ap-northeast-1"
  - group: "VPC eu-west-2"
  - group: "VPC eu-west-3"
  - group: "VPC us-east-2"
  - group: "VPC ca-central-1"
  - group: "VPC eu-central-1"
  - group: "VPC eu-west-1"
  - group: "VPC eu-north-1"
  - group: "VPC ap-south-1"
  - group: "VPC ap-east-1"
  - group: "VPC eu-south-1"
  - group: "VPC me-south-1"
  - group: "S3 uploads"
  - group: "Git Repos"
  - group: "Logins"
  - group: "ImageVersion"

stages:
- stage: StartVMs
  displayName: Start VMs
  jobs:
  - template: AzureDevOps/templates/start-agents.yml
    parameters:
      resourceGroup: $(agentResourceGroup)
      baseVmName: $(agentBaseVmName)
      vmCount: 12
      azureSubscription: 'Azure Baking Images'

- stage: Init
  displayName: Initialise
  dependsOn: StartVMs
  jobs:
    - job: Init
      displayName: Initialise
      timeoutInMinutes: 0
      cancelTimeoutInMinutes: 1

      pool:
        name: $(agentVMImage)

      steps:
        - template: AzureDevOps/templates/AWSInitRepos.yml
        - template: AzureDevOps/templates/InitVars.yml

- stage: "MergePatchPaas"
  displayName: Merge patch/pass
  jobs:
    - job: Job_1
      displayName: Merge patch/pass
      timeoutInMinutes: 0
      pool:
          name: $(agentVMImage)
      steps:
        - template: AzureDevOps/templates/AWSInitRepos.yml
          parameters:
            gitRepoBranch: $(CookbooksBranch)
            gitHubName: $(GitCookbooksGitHubName)
            gitRepoPath: $(CookbooksSourceAlias)
            downloadImageArtefacts: false

        - task: PowerShell@2
          displayName: 'Merge robe070/cookbooks repo debug/paas to patch/paas'
          inputs:
            targetType: filePath
            filePath: '$(Pipeline.Workspace)/_robe070_cookbooks/scripts/GitMerge.ps1'
            arguments:
              -GitRepoPath '$(CookbooksSourceAlias)'
              -GitSourceBranch '$(CookbooksBranch)'
              -GitTargetBranch '$(CookbooksBranchPreview)'

- stage: S3PatchPAAS
  displayName: S3 patch/paas
  dependsOn: MergePatchPAAS
  jobs:
    - job: Job_1
      displayName: S3 patch/paas
      pool:
          name: $(agentVMImage)
      steps:
        - template: AzureDevOps/templates/AWSInitRepos.yml
          parameters:
            gitRepoWriteAccess: false
            downloadImageArtefacts: false

        - task: AmazonWebServices.aws-vsts-tools.S3Upload.S3Upload@1
          displayName: 'S3 Upload: $(BucketNamePreview)'
          inputs:
            awsCredentials: AzureDevOps
            regionName: 'ap-southeast-2'
            bucketName: 'lansa'
            sourceFolder: '$(Pipeline.Workspace)/_lansa_aws-templates/CloudFormationWindows'
            globExpressions: '*.template'
            targetFolder: 'templates/$(CookbooksBranchPreview)'
            filesAcl: 'public-read'

