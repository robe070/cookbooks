    - AUSMediumStackShoeSizesw25d150j
    - AUSLargeStackShoeSizesw19d160j
  jobs:
  - job: AgentlessJob
    displayName: 'Manual Intervention: Deploy Template'
    timeoutInMinutes: 43200 # 30 days
    pool: server
    steps:
    - task: ManualValidation@0
      displayName: 'Manual Validation: Production Template'
      inputs:
        instructions: "Test that the Preview Solution Template links work and have the expected UI fixes. Deploy the template to the Production Stage"
        onTimeout: 'reject'

