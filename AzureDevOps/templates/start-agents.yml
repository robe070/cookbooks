parameters:
  - name: resourceGroup
    type: string
  - name: baseVmName
    type: string
  - name: vmCount
    type: number
  - name: azureSubscription
    type: string
  - name: dependsOn
    type: object
    default: []

jobs:
- job: StartAgents
  displayName: 'Start Agent VMs'
  dependsOn: ${{ parameters.dependsOn }}
  pool:
    vmImage: 'windows-latest'
  steps:
    - task: AzurePowerShell@5
      displayName: 'Start agent VMs in parallel'
      inputs:
        azureSubscription: ${{ parameters.azureSubscription }}
        ScriptType: 'InlineScript'
        azurePowerShellVersion: 'LatestVersion'
        Inline: |
          $resourceGroup = '${{ parameters.resourceGroup }}'
          $baseVmName = '${{ parameters.baseVmName }}'
          $vmCount = ${{ parameters.vmCount }}

          Write-Host "StartAgents Parameters:"
          Write-Host "Resource Group: $resourceGroup"
          Write-Host "Base VM Name: $baseVmName"
          Write-Host "VM Count: $vmCount"

          $jobs = @()

          for ($i = 1; $i -le $vmCount; $i++) {
            $vmName = "${baseVmName}$i"
            Write-Host "Queuing start job for ${vmName}"
            $jobs += Start-Job -ScriptBlock {
              param($vmName, $resourceGroup)

              Write-Host "Starting VM: ${vmName}"
              try {
                $vm = Get-AzVM -ResourceGroupName $resourceGroup -Name $vmName -ErrorAction SilentlyContinue
                if ($vm) {
                  Start-AzVM -ResourceGroupName $resourceGroup -Name $vmName -ErrorAction Stop
                  Write-Host "${vmName} started successfully."
                } else {
                  Write-Host "${vmName} does not exist. Skipping."
                }
              } catch {
                $_ | Out-Default | Write-Host
              }
            } -ArgumentList $vmName, $resourceGroup
          }

          Write-Host "Waiting for all VM start jobs to complete..."
          $jobs | Wait-Job

          foreach ($job in $jobs) {
            Receive-Job -Job $job | Out-Default | Write-Host
            Remove-Job -Job $job
          }

          Write-Host "All VMs started."
