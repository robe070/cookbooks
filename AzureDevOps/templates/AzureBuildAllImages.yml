    LanguageSuffix: 'j'
    VersionText: ${{ variables.VersionText }}
    CloudImageName: $(Windows-2019-IMAGE-NAME-JPN)
    ScriptTimeout: ${{ parameters.ScriptTimeout }}

- template: AzureBuildImage.yml
  parameters:
    OSVersion: '19'
    LansaMajorVersion: '16'
    LansaMinorVersion: '0'
    LanguageSuffix: 'j'
    VersionText: ${{ variables.VersionText }}
    CloudImageName: $(Windows-2019-IMAGE-NAME-JPN)
    ScriptTimeout: ${{ parameters.ScriptTimeout }}

- template: AzureBuildImage.yml
  parameters:
    OSVersion: '22'
    LansaMajorVersion: '15'
    LansaMinorVersion: '0'
    LanguageSuffix: 'j'
    VersionText: ${{ variables.VersionText }}
    CloudImageName: $(Windows-2022-IMAGE-NAME-JPN)
    ScriptTimeout: ${{ parameters.ScriptTimeout }}

- template: AzureBuildImage.yml
  parameters:
    OSVersion: '22'
    LansaMajorVersion: '16'
