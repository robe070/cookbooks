parameters:
  - name: OSVersion
    type: string
  - name: LansaMajorVersion
    type: number
  - name: LansaMinorVersion
    type: number
  - name: VersionText
    type: string
  - name: CloudImageName
    type: string
  - name: ScriptTimeout # Can't refer to a variable in a template thats declared in the parent yml. Hence it must be passed as a parameter
    type: number
  - name: LanguageSuffix # Optional. English is an empty string. Japanese = 'J'
    type: string
    default: ''

jobs:
- job: ${{ format('Job_w{0}d_{1}_{2}{3}_{4}', parameters.OSVersion, parameters.LansaMajorVersion, parameters.LansaMinorVersion, parameters.LanguageSuffix, parameters.VersionText) }}
  displayName: ${{ format('w{0}d-{1}-{2}{3}-{4}', parameters.OSVersion, parameters.LansaMajorVersion, parameters.LansaMinorVersion, parameters.LanguageSuffix, parameters.VersionText)}}
  timeoutInMinutes: ${{ parameters.ScriptTimeout }}
  condition: and(succeeded(), or(eq(variables['Build-${{ format('w{0}d-{1}-{2}{3}', parameters.OSVersion, parameters.LansaMajorVersion, parameters.LansaMinorVersion, parameters.LanguageSuffix) }}'], 'true'), eq(variables['Build-all'], 'true')))

  variables:
    JobVersionTextRoot: ${{ format('w{0}d-{1}-{2}{3}', parameters.OSVersion, parameters.LansaMajorVersion, parameters.LansaMinorVersion, parameters.LanguageSuffix) }}
    JobVersionText: ${{ format('w{0}d-{1}-{2}{3}-{4}', parameters.OSVersion, parameters.LansaMajorVersion, parameters.LansaMinorVersion, parameters.LanguageSuffix, parameters.VersionText)}}
    JobResourceGroupName: BakingDP-${{ format('w{0}d-{1}-{2}{3}-{4}', parameters.OSVersion, parameters.LansaMajorVersion, parameters.LansaMinorVersion, parameters.LanguageSuffix, parameters.VersionText)}}
    JobImageName: ${{ parameters.CloudImageName }}
    JobVersionMajor: ${{ parameters.LansaMajorVersion }}
    JobVersionMinor: ${{ parameters.LansaMinorVersion }}
    JobTag: 'test-temp'
    JobImageUrlOutputFileName: ${{ format('w{0}d-{1}-{2}{3}.txt', parameters.OSVersion, parameters.LansaMajorVersion, parameters.LansaMinorVersion, parameters.LanguageSuffix) }}
    JobTestVmName: T${{ parameters.OSVersion }}${{ parameters.LansaMajorVersion }}${{ parameters.LansaMinorVersion }}${{ parameters.LanguageSuffix }}${{ variables['Build.BuildId'] }}

    ${{ if eq(parameters.LanguageSuffix, 'j') }}:
      Language: 'JPN'
      InstallLanguagePack: $True
    ${{ else }}:
      Language: 'ENG'
      InstallLanguagePack: $False
  pool:
    name: $(vmImage)

  steps:
  - checkout: self
    fetchTags: false

  - task: PowerShell@2
    displayName: Print Variable Values
    inputs:
      targetType: inline
      script: |
        Write-Host "JobVersionTextRoot: $(JobVersionTextRoot)" | Out-Default | Write-Host
        Write-Host "JobVersionText: $(JobVersionText)" | Out-Default | Write-Host
        Write-Host "JobResourceGroupName: $(JobResourceGroupName)" | Out-Default | Write-Host
        Write-Host "JobImageName: $(JobImageName)" | Out-Default | Write-Host
        Write-Host "JobVersionMajor: $(JobVersionMajor)" | Out-Default | Write-Host
        Write-Host "JobVersionMinor: $(JobVersionMinor)" | Out-Default | Write-Host
        Write-Host "JobTag: $(JobTag)" | Out-Default | Write-Host
        Write-Host "JobImageUrlOutputFileName: $(JobImageUrlOutputFileName)" | Out-Default | Write-Host
        Write-Host "JobTestVmName: $(JobTestVmName)" | Out-Default | Write-Host

  # NOTE: Az modules are no longer installed/pinned here. The self-hosted agents install Az (unpinned)
  # via 'create agents.yml' and are updated in a controlled manner. Pinning Az here (old Az.Compute
  # 4.2.1) is what caused 'New-AzVMConfig : parameter SecurityType cannot be found'.

  - task: PowerShell@2
    name: ''
    displayName: Azure Login
    inputs:
      filePath: scripts/AzureLogin.ps1
      arguments: -CloudAccount $(azureUserId) -CloudSecret (ConvertTo-SecureString "$(clientSecret)" -AsPlainText -force)
      workingDirectory: scripts

  - task: PowerShell@2
    displayName: 'Delete RG: $(JobResourceGroupName)'
    inputs:
      targetType: inline
      script: |
        Write-Host Deleting Resource Group $(JobResourceGroupName)
        Remove-AzResourceGroup -Name $(JobResourceGroupName) -Force -ErrorAction SilentlyContinue
      errorActionPreference: silentlyContinue

  - task: PowerShell@2
    condition: true
    name: BuildImage
    displayName: Build Image
    timeoutInMinutes: ${{ parameters.ScriptTimeout }}
    inputs:
      filePath: scripts/bake-scalable-azure-image-pipeline.ps1
      arguments: -VersionText $(JobVersionText) -VersionMajor $(JobVersionMajor) -VersionMinor $(JobVersionMinor) -AmazonAMIName $(JobImageName) -GitBranch "$(GitBranch)" -Cloud 'Azure' -Win2012 $false -GitUserName $(GitUserName) -MaxRetry $(MaxRetry) -ExternalIPAddresses $(ExternalIPAddresses) -InstallLanguagePack:$(InstallLanguagePack) -Language $(Language)
      workingDirectory: scripts

  - task: PowerShell@2
    name: ''
    displayName: 'Tag RG'
    inputs:
      targetType: inline
      script: >-
        Write-Host "Tagging $(JobResourceGroupName) with Usage = '$(JobTag)'" | Out-Default | Write-Host

        Set-AzResourceGroup -Name $(JobResourceGroupName) -Tag @{ Usage = '$(JobTag)' }

  - task: PowerShell@2
    name: ''
    displayName: 'Generate: Image URL'
    inputs:
      targetType: inline
      script: >-
        Write-Host "Writing the Full Image Resource Id $(BuildImage.ImageResourceId) in the $(Build.ArtifactStagingDirectory)" | Out-Default | Write-Host

        Out-File -FilePath (Join-Path $(Build.ArtifactStagingDirectory) $(JobImageUrlOutputFileName)) -InputObject $(BuildImage.ImageResourceId) | Out-Default | Write-Host

        Write-Host "Full Image Resource Id written successfully" | Out-Default | Write-Host

  - task: PowerShell@2
    name: ''
    displayName: VM Tests
    timeoutInMinutes: 15 # Typically takes about 6 mins on Azure. Much longer than that and the VM will not reach ready state.
    env:
        TestImageName: $(JobVersionText)
        TestCloudName: Azure
        AtomicBuild: $(AtomicBuild)
        TestVmName: $(JobTestVmName)
    inputs:
      filePath: scripts/invoke-pester-tests.ps1

  - task: PublishTestResults@2
    displayName: Publish Test Results **/Test-*.xml
    inputs:
      testRunner: NUnit
      testResultsFiles: '**/Test-*.xml'
      testRunTitle: $(JobVersionTextRoot)

  - task: PublishBuildArtifacts@1
    name: ''
    displayName: 'Publish Artifact: Image URL'
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/$(JobVersionTextRoot).txt
      ArtifactName: $(JobVersionTextRoot)
      FileCopyOptions: ''

  - task: AzureResourceManagerTemplateDeployment@3
    displayName: Delete RG $(JobResourceGroupName)
    inputs:
      ConnectedServiceName: $(ConnectedServiceName)
      subscriptionName: 739c4e86-bd75-4910-8d6e-d7eb23ab94f3
      action: DeleteRG
      resourceGroupName: $(JobResourceGroupName)