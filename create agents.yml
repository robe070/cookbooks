# Create Agents.yml
trigger:
- none  # Manual trigger only

variables:
- group: Logins
- name: resourceGroup
  value: 'AzureDevOps'
- name: location
  value: 'eastus'
- name: baseVmName
  value: 'Agent'
- name: vmCount
  value: 3
- name: InstallVMsOnly
  value: 'true'
- name: adminUsername
  value: 'lansa'
- name: vnetName
  value: 'AzureDevOps-vnet'
- name: subnetName
  value: 'default'

jobs:
- job: CreateVMs
  displayName: 'Create & Install ${{ variables.vmCount }} Agent VMs'
  pool:
    vmImage: 'windows-latest'
  steps:

  - task: AzurePowerShell@5
    # condition: eq(variables['InstallVMsOnly'], 'false')
    displayName: Create VMs
    inputs:
      azureSubscription: $(ConnectedServiceNameARM)
      ScriptType: 'InlineScript'
      azurePowerShellVersion: 'LatestVersion'
      Inline: |
        $resourceGroup = '$(resourceGroup)'
        $location = '$(location)'
        $adminUsername = '$(adminUsername)'
        $adminPassword = ConvertTo-SecureString '$(agentAdminPassword)' -AsPlainText -Force
        $vmCount = $(vmCount)
        $baseVmName = '$(baseVmName)'
        $vnet = Get-AzVirtualNetwork -Name '$(vnetName)' -ResourceGroupName $resourceGroup
        $subnet = $vnet.Subnets | Where-Object { $_.Name -eq '$(subnetName)' }

        for ($i = 1; $i -le $vmCount; $i++) {
          $vmName = "${baseVmName}$i"

          if (Get-AzVM -ResourceGroupName $resourceGroup -Name $vmName -ErrorAction SilentlyContinue) {
            Write-Host "VM $vmName already exists. Skipping creation."
            continue
          }

          Write-Host "Creating VM: $vmName"

          $cred = New-Object System.Management.Automation.PSCredential($adminUsername, $adminPassword)

          $pip = New-AzPublicIpAddress -Name "${vmName}-pip" -ResourceGroupName $resourceGroup -Location $location `
            -AllocationMethod Dynamic -Sku Basic

          $nic = New-AzNetworkInterface -Name "${vmName}-nic" -ResourceGroupName $resourceGroup -Location $location `
            -SubnetId $subnet.Id -PublicIpAddressId $pip.Id

          $vmConfig = New-AzVMConfig -VMName $vmName -VMSize 'Standard_D2s_v3' |
            Set-AzVMOperatingSystem -Windows -ComputerName $vmName -Credential $cred -ProvisionVMAgent -EnableAutoUpdate |
            Set-AzVMSourceImage -PublisherName 'MicrosoftWindowsServer' -Offer 'WindowsServer' -Skus '2022-datacenter' -Version 'latest' |
            Add-AzVMNetworkInterface -Id $nic.Id

          New-AzVM -ResourceGroupName $resourceGroup -Location $location -VM $vmConfig
        }

  - task: AzurePowerShell@5
    displayName: 'Install Azure DevOps Agent via WinRM and other required apps'
    inputs:
      azureSubscription: $(ConnectedServiceNameARM)
      ScriptType: 'InlineScript'
      azurePowerShellVersion: 'LatestVersion'
      Inline: |
        $resourceGroup = '$(resourceGroup)'
        $adminUsername = '$(adminUsername)'
        $adminPassword = '$(adminPassword)'
        $AzurePAT = '$(AzurePATforRobG)'
        $vmCount = $(vmCount)
        $baseVmName = '$(baseVmName)'

        for ($i = 1; $i -le $vmCount; $i++) {
          $vmName = "${baseVmName}0$i"
          Write-Host "Installing agent on: $vmName"

          try {
            $result = Invoke-AzVMRunCommand -ResourceGroupName $resourceGroup -Name $vmName -CommandId 'RunPowerShellScript' -ScriptPath 'c:\install-azure-agent.ps1' -Parameter @(
              "vmName=$vmName",
              "adminUsername=$adminUsername",
              "adminPassword=$adminPassword",
              "AzurePAT=$AzurePAT"
            ) -ErrorAction Stop

            if ($result -and $result.Value) {
              foreach ($entry in $result.Value) {
                Write-Host "[$vmName] Output: $($entry.Message)"
              }
            } else {
              Write-Host "[$vmName] No output returned from script execution."
            }
          } catch {
            Write-Host "[$vmName] Error during script execution: $($_.Exception.Message)"
          }
        }
