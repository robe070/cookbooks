# Create Agents.yml
trigger:
- none  # Manual trigger only

variables:
- group: Logins
- name: resourceGroup
  value: 'AzureDevOps'
- name: location
  value: 'eastus'
- name: baseVmName
  value: 'Agent'
- name: vmCount
  value: 3
- name: InstallVMsOnly
  value: 'true'
- name: adminUsername
  value: 'lansa'
- name: vnetName
  value: 'AzureDevOps-vnet'
- name: subnetName
  value: 'default'

jobs:
- job: CreateVMs
  displayName: 'Create & Install ${{ variables.vmCount }} Agent VMs'
  pool:
    vmImage: 'windows-latest'
  steps:

  - task: AzurePowerShell@5
    # condition: eq(variables['InstallVMsOnly'], 'false')
    displayName: Create VMs
    inputs:
      azureSubscription: $(ConnectedServiceNameARM)
      ScriptType: 'InlineScript'
      azurePowerShellVersion: 'LatestVersion'
      Inline: |
        $resourceGroup = '$(resourceGroup)'
        $location = '$(location)'
        $adminUsername = '$(adminUsername)'
        $adminPassword = ConvertTo-SecureString '$(agentAdminPassword)' -AsPlainText -Force
        $vmCount = $(vmCount)
        $baseVmName = '$(baseVmName)'
        $vnet = Get-AzVirtualNetwork -Name '$(vnetName)' -ResourceGroupName $resourceGroup
        $subnet = $vnet.Subnets | Where-Object { $_.Name -eq '$(subnetName)' }

        for ($i = 1; $i -le $vmCount; $i++) {
          $vmName = "${baseVmName}$i"

          if (Get-AzVM -ResourceGroupName $resourceGroup -Name $vmName -ErrorAction SilentlyContinue) {
            Write-Host "VM $vmName already exists. Skipping creation."
            continue
          }

          Write-Host "Creating VM: $vmName"

          $cred = New-Object System.Management.Automation.PSCredential($adminUsername, $adminPassword)

          $pip = New-AzPublicIpAddress -Name "${vmName}-pip" -ResourceGroupName $resourceGroup -Location $location `
            -AllocationMethod Dynamic -Sku Basic

          $nic = New-AzNetworkInterface -Name "${vmName}-nic" -ResourceGroupName $resourceGroup -Location $location `
            -SubnetId $subnet.Id -PublicIpAddressId $pip.Id -EnableAcceleratedNetworking $true

          $vmConfig = New-AzVMConfig -VMName $vmName -VMSize 'Standard_D2s_v3' |
            Set-AzVMOperatingSystem -Windows -ComputerName $vmName -Credential $cred -ProvisionVMAgent -EnableAutoUpdate |
            Set-AzVMSourceImage -PublisherName 'MicrosoftWindowsServer' -Offer 'WindowsServer' -Skus '2022-datacenter' -Version 'latest' |
            Add-AzVMNetworkInterface -Id $nic.Id

          New-AzVM -ResourceGroupName $resourceGroup -Location $location -VM $vmConfig
        }

  - task: AzurePowerShell@5
    displayName: 'Install Azure DevOps Agent via WinRM and other required apps'
    inputs:
      azureSubscription: $(ConnectedServiceNameARM)
      ScriptType: 'InlineScript'
      azurePowerShellVersion: 'LatestVersion'
      Inline: |
        $resourceGroup = '$(resourceGroup)'
        $adminUsername = '$(adminUsername)'
        $agentAdminPassword = '$(agentAdminPassword)'
        $AzurePAT = '$(AzurePATforRobG)'
        $vmCount = $(vmCount)
        $baseVmName = '$(baseVmName)'

        for ($i = 3; $i -le $vmCount; $i++) {
          $vmName = "${baseVmName}$i"
          Write-Host "[$vmName] Installing agent"

          try {
            if (-not (Get-AzVM -ResourceGroupName $resourceGroup -Name $vmName -ErrorAction SilentlyContinue)) {
              Write-Host "VM $vmName does not exist. Skipping installation."
              continue
            }

            $ScriptBlock = {
              param (
                  [string]$vmName,
                  [string]$adminUsername,
                  [string]$adminPassword,
                  [string]$AzurePAT
              )
              push-location
              stop-transcript -ErrorAction Ignore
              try {
                  Write-Host ("Script echoing vmName = $vmName")

                  $LogFile = "C:\install-log.txt"
                  Start-Transcript -Path $LogFile -Force -IncludeInvocationHeader

                  if (-not (Test-Path C:\agent\config.cmd))
                  #if ((Test-Path C:\agent\config.cmd))
                  {
                      Write-Host "Installing agent on: $vmName"

                      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                      Invoke-WebRequest -Uri https://download.agent.dev.azure.com/agent/4.259.0/vsts-agent-win-x64-4.259.0.zip -OutFile c:\agent.zip
                      Expand-Archive c:\agent.zip -DestinationPath C:\agent
                      cd C:\agent

                      .\config.cmd --unattended --url https://dev.azure.com/VisualLansa `
                          --auth pat --token $AzurePAT `
                          --pool Default --agent $vmName --acceptTeeEula --runAsService `
                          --windowsLogonAccount $adminUsername --windowsLogonPassword $adminPassword

                      # Optional start
                      # .\svc install
                      # .\svc start
                  } else {
                      Write-Host 'Agent already installed. Skipping.'
                  }

                  # Ensure correct version of Pester
                  if (Test-Path 'C:\Program Files\WindowsPowerShell\Modules\Pester\3.4.0') {
                      Rename-Item -Path 'C:\Program Files\WindowsPowerShell\Modules\Pester\3.4.0' -NewName '3.4.0-disabled'
                  } else {
                      Write-Host 'Auto-installed Pester version already disabled. Skipping.'
                  }

                  if (Test-Path 'C:\Program Files\WindowsPowerShell\Modules\Pester\6.6.1') {
                      Install-Module Pester -RequiredVersion 5.6.1 -Scope AllUsers -Force -AllowClobber -SkipPublisherCheck
                  } else {
                      Write-Host 'Correct Pester version already installed. Skipping.'
                  }
              } catch {
                  $_ | Out-Default | Write-Host
              } finally {
                  Stop-Transcript -ErrorAction Ignore
                  pop-location
              }
            }

            $Script = [scriptblock]::create($ScriptBlock)
            $result = Invoke-AzVMRunCommand -ResourceGroupName $resourceGroup -Name $vmName -CommandId 'RunPowerShellScript' -ScriptString $script  -Parameter @{
              vmName=$vmName;
              adminUsername=$adminUsername;
              adminPassword=$agentAdminPassword;
              AzurePAT=$AzurePAT;
            } -ErrorAction Stop

          } catch {
            $_ | Out-Default | Write-Host
            throw
          } finally {
            if ($result -and $result.Value) {
              foreach ($entry in $result.Value) {
                if (-not ([string]::IsNullOrEmpty($entry) ) ) {
                  Write-Host "[$vmName] $($entry.Message)"
                }
              }
            } else {
              Write-Host "[$vmName] No output returned from script execution."
            }
          }
        }
