# --- Which VMs this run touches -----------------------------------------------------------
# Prompted for on every run - a parameter, not a variable, because a YAML-defined variable
# cannot be made settable at queue time. It gates EVERY step below (VM creation/start,
# tagging, the agent install, pwsh), so a re-run can be aimed at one or two rebuilt agents
# without touching the rest. Names must be Agent1..Agent14 (validated at runtime, see the
# resolution block in the first step); '*' means all of them, and an empty value deliberately
# selects NOTHING rather than everything, so a mistyped value cannot kick off a 14-way run.
#
# No default: the Run dialog will not start the pipeline until a value is typed. That is
# only safe while 'trigger: none' holds - a schedule or a pipeline-resource trigger cannot
# supply one, so give it 'default: '''' ' if this is ever queued non-interactively.
#
# ${{ parameters }} is substituted into this file's text at compile time, which is what
# carries the value into the inline scripts and on into the scriptblock that RunCommand
# ships to each VM. It is therefore pasted verbatim - keep it to bare names and commas.
parameters:
- name: targetVmNames
  displayName: 'Agent VMs to process (comma-separated, or * for all)'
  type: string

trigger:
- none  # Manual trigger only

variables:
- group: Azure Logins
# - group: Agents
- name: location
  value: 'eastus'
- name: agentResourceGroup
  value: 'AzureDevOps'
- name: agentBaseVmName
  value: Agent
- name: vmCount
  value: 14
# --- VM hardware / image ------------------------------------------------------------------
# Standard_F2as_v6 (2 vCPU / 8 GiB) 4 GiB was too little.
# The entire v6 family is Hyper-V Gen2-ONLY and NVMe-ONLY, which forces the two settings
# below: a Gen1 image SKU, or the default SCSI disk controller, will not deploy on it.
# Also note Fv6 has NO temp disk - there is no D: drive. See the warning the script emits.
- name: vmSize
  value: 'Standard_F2as_v6'
- name: imageOffer
  value: 'WindowsServer'
# The -g2 suffix is what makes this Gen2. Plain '2025-datacenter' is Gen1 and will be rejected.
- name: imageSku
  value: '2025-datacenter-g2'
- name: diskControllerType
  value: 'NVMe'
# 'TrustedLaunch' adds vTPM + Secure Boot (supported by this image and size). Set to
# 'Standard' for plain Gen2 VMs without them.
- name: securityType
  value: 'TrustedLaunch'
# --- PowerShell 7 -------------------------------------------------------------------------
# No Windows Server release ships pwsh.exe. Microsoft-hosted 'windows-latest' images add it,
# self-hosted agents do not - so a task with 'pwsh: true' fails on these agents with
# "The term 'pwsh.exe' is not recognized" until it is installed. Installing it here keeps
# self-hosted and Microsoft-hosted agents interchangeable for pipelines moved between them.
# This is a minimum for the idempotency check only, not a download URL - the installer always
# fetches the current stable release. Bump it to force an upgrade on existing agents.
- name: pwshMinimumVersion
  value: '7.4.0'
- name: adminUsername
  value: 'lansa'
- name: vnetName
  value: 'AzureDevOps-vnet'
- name: subnetName
  value: 'default'
- name: storageAccountName
  value: 'lansadevopsdiagstorage'  # must be globally unique
- name: agentPoolName
  value: 'Default'

jobs:
- job: CreateVMs
  displayName: 'Create & Install Agent VMs (${{ parameters.targetVmNames }})'
  pool:
    vmImage: 'windows-latest'
  steps:

  - task: AzurePowerShell@5
    displayName: 'Create VMs (if missing) & Shared Resources'
    inputs:
      azureSubscription: $(ConnectedServiceName)
      ScriptType: 'InlineScript'
      azurePowerShellVersion: 'LatestVersion'
      Inline: |
        $ErrorActionPreference = 'Stop'

        $resourceGroup = '$(agentResourceGroup)'
        $location = '$(location)'
        $vmCount = $(vmCount)
        $adminUsername = '$(adminUsername)'
        $adminPassword = ConvertTo-SecureString '$(agentAdminPassword)' -AsPlainText -Force
        $baseVmName = '$(agentBaseVmName)'
        $vnetName = '$(vnetName)'
        $subnetName = '$(subnetName)'
        $nsgName = 'Agent1-nsg'
        $storageAccountName = '$(storageAccountName)'
        $vmSize = '$(vmSize)'
        $imageOffer = '$(imageOffer)'
        $imageSku = '$(imageSku)'
        $diskControllerType = '$(diskControllerType)'
        $securityType = '$(securityType)'
        $imagePublisher = 'MicrosoftWindowsServer'

        # --- Resolve the target VM list --------------------------------------------------------
        # See the comment on the targetVmNames parameter. Every loop in this pipeline iterates
        # $vmNames rather than 1..$vmCount, so this one list decides what the whole run touches.
        # The same block is repeated in the install step below - inline YAML scripts cannot share
        # a function, so keep the two in step if you change either.
        $requested = @(('${{ parameters.targetVmNames }}' -split ',').Trim() | Where-Object { $_ })
        $allVmNames = @(1..$vmCount | ForEach-Object { "$baseVmName$_" })
        if ($requested -contains '*') {
          $vmNames = $allVmNames
        } else {
          # Reject unknown names rather than silently creating an Agent99 or skipping a typo.
          $unknown = @($requested | Where-Object { $allVmNames -notcontains $_ })
          if ($unknown) {
            throw "targetVmNames contains name(s) outside ${baseVmName}1..${baseVmName}${vmCount}: $($unknown -join ', ')"
          }
          # Select from $allVmNames rather than using $requested as typed: -contains is
          # case-insensitive, but the name is used verbatim as the VM's ComputerName and as the
          # agent-pool registration name. This also de-dupes and orders by agent number.
          $vmNames = @($allVmNames | Where-Object { $requested -contains $_ })
        }
        if (-not $vmNames) {
          Write-Host "##vso[task.logissue type=warning]targetVmNames is empty - no VMs will be created or configured."
        }

        Write-Host "Provisioning parameters:"
        Write-Host "Target VMs ($($vmNames.Count) of $vmCount): $($vmNames -join ', ')"
        Write-Host "Resource Group: $resourceGroup"
        Write-Host "Location: $location"
        Write-Host "VM Count: $vmCount"
        Write-Host "Admin Username: $adminUsername"
        Write-Host "Base VM Name: $baseVmName"
        Write-Host "VNet Name: $vnetName"
        Write-Host "Subnet Name: $subnetName"
        Write-Host "NSG Name: $nsgName"
        Write-Host "Storage Account Name: $storageAccountName"
        Write-Host "VM Size: $vmSize"
        Write-Host "Image: $imagePublisher/$imageOffer/$imageSku"
        Write-Host "Disk Controller: $diskControllerType"
        Write-Host "Security Type: $securityType"

        # --- Validate size / image / disk-controller compatibility BEFORE creating anything ----
        # These three have to agree or New-AzVM fails part way through a 14-way parallel run,
        # leaving a mess of half-created NICs and disks. Cheap to check up front.
        $sku = Get-AzComputeResourceSku -Location $location |
                 Where-Object { $_.ResourceType -eq 'virtualMachines' -and $_.Name -eq $vmSize }
        if (-not $sku) { throw "VM size '$vmSize' is not available in $location." }
        if ($sku.Restrictions.Count) {
          throw "VM size '$vmSize' is restricted in ${location}: $(($sku.Restrictions.ReasonCode | Select-Object -Unique) -join ', ')"
        }

        $caps = @{}
        $sku.Capabilities | ForEach-Object { $caps[$_.Name] = $_.Value }
        $skuGens = ($caps['HyperVGenerations'] -split ',').Trim()
        $skuCtrls = if ($caps['DiskControllerTypes']) { ($caps['DiskControllerTypes'] -split ',').Trim() } else { @('SCSI') }

        $imageVersion = Get-AzVMImage -Location $location -PublisherName $imagePublisher -Offer $imageOffer -Skus $imageSku |
                          Sort-Object { [version]$_.Version } | Select-Object -Last 1
        if (-not $imageVersion) { throw "Image $imagePublisher/$imageOffer/$imageSku not found in $location." }
        $imageGen = (Get-AzVMImage -Location $location -PublisherName $imagePublisher -Offer $imageOffer `
                       -Skus $imageSku -Version $imageVersion.Version).HyperVGeneration

        Write-Host "Size '$vmSize': $($caps['vCPUs']) vCPU / $($caps['MemoryGB']) GiB, generations $($skuGens -join '/'), disk controllers $($skuCtrls -join '/')"
        Write-Host "Image '$imageSku' latest version $($imageVersion.Version) is $imageGen"

        if ($skuGens -notcontains $imageGen) {
          throw "Image SKU '$imageSku' is $imageGen but size '$vmSize' supports $($skuGens -join '/') only. Gen2-only sizes need a '-g2' image SKU."
        }
        if ($skuCtrls -notcontains $diskControllerType) {
          throw "Size '$vmSize' supports disk controller(s) $($skuCtrls -join '/') but diskControllerType is '$diskControllerType'."
        }
        if ($caps['MaxResourceVolumeMB'] -eq '0') {
          Write-Host "##vso[task.logissue type=warning]$vmSize has no temp disk - the agents will have NO D: drive. Anything writing to D: must be changed."
        }
        Write-Host "Size / image / disk-controller combination validated."

        $vnet = Get-AzVirtualNetwork -Name $vnetName -ResourceGroupName $resourceGroup
        $subnet = $vnet.Subnets | Where-Object { $_.Name -eq $subnetName }
        $nsg = Get-AzNetworkSecurityGroup -ResourceGroupName $resourceGroup -Name $nsgName

        # Create shared diagnostics storage account if it doesn't exist
        $storage = Get-AzStorageAccount -ResourceGroupName $resourceGroup -Name $storageAccountName -ErrorAction SilentlyContinue
        if (-not $storage) {
          Write-Host "Creating storage account $storageAccountName for boot diagnostics..."
          $storage = New-AzStorageAccount -ResourceGroupName $resourceGroup -Name $storageAccountName `
            -Location $location -SkuName Standard_LRS -Kind StorageV2
        } else {
          Write-Host "Using existing storage account $storageAccountName for boot diagnostics."
        }

        $diagStorageUri = $storage.PrimaryEndpoints.Blob.ToString()

        $adminCred = New-Object PSCredential($adminUsername, $adminPassword)

        $jobs = @()
        foreach ($targetVmName in $vmNames) {
          $job = Start-Job -ScriptBlock {
            param (
              $vmName, $resourceGroup, $location, $adminCred,
              $diagStorageUri, $subnet, $nsg, $storageAccountName,
              $vmSize, $imagePublisher, $imageOffer, $imageSku, $diskControllerType, $securityType
            )

            $ErrorActionPreference = 'Stop'
            $nicName = "${vmName}-nic"
            $pipName = "${vmName}-pip"

            Write-Host "[Job $vmName] Starting provisioning..."

            # Skip if VM exists
            $vm = Get-AzVM -ResourceGroupName $resourceGroup -Name $vmName -ErrorAction SilentlyContinue

            if ($vm) {
              Write-Host "[Job $vmName] VM already exists. Checking status..."
              # Check if VM is running, if not, start it
              $vmStatus = (Get-AzVM -ResourceGroupName $resourceGroup -Name $vmName -Status).Statuses | Where-Object { $_.Code -like 'PowerState/*' }
              if ($vmStatus.Code -ne 'PowerState/running') {
                Write-Host "[Job $vmName] VM exists but is not running. Starting VM..."
                Start-AzVM -ResourceGroupName $resourceGroup -Name $vmName | Out-Default | Write-Host
                Write-Host "[Job $vmName] VM started."
              } else {
                Write-Host "[Job $vmName] VM is already running."
              }
            } else {
              # Delete orphaned disks
              $diskPrefix = "${vmName}_OsDisk_1_"
              $orphanDisks = Get-AzDisk -ResourceGroupName $resourceGroup | Where-Object {
                $_.Name -like "$diskPrefix*"
              }
              foreach ($disk in $orphanDisks) {
                Write-Host "[Job $vmName] Deleting orphaned disk: $($disk.Name)"
                Remove-AzDisk -ResourceGroupName $resourceGroup -Name $disk.Name -Force
              }

              # Create PIP
              $pip = Get-AzPublicIpAddress -Name $pipName -ResourceGroupName $resourceGroup -ErrorAction SilentlyContinue
              if (-not $pip) {
                $pip = New-AzPublicIpAddress -Name $pipName -ResourceGroupName $resourceGroup `
                  -Location $location -AllocationMethod Static -Sku Standard -Force
              }

              # Create NIC
              $nic = Get-AzNetworkInterface -Name $nicName -ResourceGroupName $resourceGroup -ErrorAction SilentlyContinue
              if (-not $nic) {
                $nic = New-AzNetworkInterface -Name $nicName -ResourceGroupName $resourceGroup `
                  -Location $location -SubnetId $subnet.Id -PublicIpAddressId $pip.Id `
                  -EnableAcceleratedNetworking -NetworkSecurityGroupId $nsg.Id -Force
              }

              # VM Config
              # DiskControllerType is mandatory for the v6 families - they are NVMe-only, and the
              # implicit default is SCSI. Trusted Launch is opt-in via the securityType variable;
              # when it is 'Standard' we must not pass the vTPM / Secure Boot switches at all.
              $configArgs = @{
                VMName             = $vmName
                VMSize             = $vmSize
                DiskControllerType = $diskControllerType
              }
              if ($securityType -eq 'TrustedLaunch') {
                $configArgs['SecurityType']     = 'TrustedLaunch'
                $configArgs['EnableVtpm']       = $true
                $configArgs['EnableSecureBoot'] = $true
              }

              $vmConfig = New-AzVMConfig @configArgs |
                Set-AzVMOperatingSystem -Windows -ComputerName $vmName -Credential $adminCred -ProvisionVMAgent -EnableAutoUpdate |
                Set-AzVMSourceImage -PublisherName $imagePublisher -Offer $imageOffer -Skus $imageSku -Version 'latest' |
                Add-AzVMNetworkInterface -Id $nic.Id |
                Set-AzVMBootDiagnostic -Enable -ResourceGroupName $resourceGroup -StorageAccountName $storageAccountName

              Write-Host "[Job $vmName] Creating VM..."
              New-AzVM -ResourceGroupName $resourceGroup -Location $location -VM $vmConfig
              Write-Host "[Job $vmName] VM created successfully."

              # Get the VM object again after creation
              $vm = Get-AzVM -ResourceGroupName $resourceGroup -Name $vmName
            }

            # Always check and set ShutdownPolicy=Excluded tag
            $tags = $vm.Tags
            if (-not $tags) {
              $tags = @{}
            }
            if (-not $tags.ContainsKey('ShutdownPolicy') -or $tags['ShutdownPolicy'] -ne 'Excluded') {
              Write-Host "[Job $vmName] Adding tag ShutdownPolicy=Excluded"
              $tags['ShutdownPolicy'] = 'Excluded'
              Set-AzResource -ResourceId $vm.Id -Tag $tags -Force -ApiVersion "2024-11-01" | Out-Default | Write-Host
              Write-Host "[Job $vmName] Tag applied."
            } else {
              Write-Host "[Job $vmName] Tag ShutdownPolicy=Excluded already present."
            }
          } -ArgumentList $targetVmName, $resourceGroup, $location, $adminCred,
                         $diagStorageUri, $subnet, $nsg, $storageAccountName,
                         $vmSize, $imagePublisher, $imageOffer, $imageSku, $diskControllerType, $securityType

          $jobs += $job
        }

        Write-Host "Waiting for all parallel provisioning jobs to complete..."
        foreach ($job in $jobs) {
          try {
              $output = Receive-Job -Job $job -Wait -AutoRemoveJob -ErrorAction Continue
              Write-Host "Job Output:"
              $output | Out-Default | Write-Host
          } catch {
              Write-Host "Caught exception from job:"
              $_ | Out-Default | Write-Host
              throw
          }

          if ($job.State -eq 'Failed') {
              $err = $job.ChildJobs[0].JobStateInfo.Reason
              Write-Host "Job failed with reason:"
              $err | Out-Default | Write-Host
              throw
          }
        }
        Write-Host "All VMs created and tags checked/applied."

  - task: AzurePowerShell@5
    displayName: 'Install DevOps Agents in Parallel (${{ parameters.targetVmNames }})'
    inputs:
      azureSubscription: $(ConnectedServiceName)
      ScriptType: 'InlineScript'
      azurePowerShellVersion: 'LatestVersion'
      Inline: |
        $ErrorActionPreference = 'Stop'
        Write-Host "VM Count: $(vmCount)"
        Write-Host "Installing to pool: $(agentPoolName)"

        $resourceGroup = '$(agentResourceGroup)'
        $adminUsername = '$(adminUsername)'
        $adminPassword = '$(agentAdminPassword)'
        $AzurePAT = '$(AzurePATforRobG)'
        $baseVmName = '$(agentBaseVmName)'
        $vmCount = $(vmCount)

        # --- Resolve the target VM list --------------------------------------------------------
        # Same block as in the create step above - see the comment there and on the targetVmNames
        # parameter. Repeated rather than shared because inline YAML scripts run in separate
        # processes; keep the two copies in step.
        $requested = @(('${{ parameters.targetVmNames }}' -split ',').Trim() | Where-Object { $_ })
        $allVmNames = @(1..$vmCount | ForEach-Object { "$baseVmName$_" })
        if ($requested -contains '*') {
          $vmNames = $allVmNames
        } else {
          $unknown = @($requested | Where-Object { $allVmNames -notcontains $_ })
          if ($unknown) {
            throw "targetVmNames contains name(s) outside ${baseVmName}1..${baseVmName}${vmCount}: $($unknown -join ', ')"
          }
          # Select from $allVmNames rather than using $requested as typed: -contains is
          # case-insensitive, but the name is used verbatim as the VM's ComputerName and as the
          # agent-pool registration name. This also de-dupes and orders by agent number.
          $vmNames = @($allVmNames | Where-Object { $requested -contains $_ })
        }
        if (-not $vmNames) {
          Write-Host "##vso[task.logissue type=warning]targetVmNames is empty - no agents will be installed."
        }
        Write-Host "Target VMs ($($vmNames.Count) of $vmCount): $($vmNames -join ', ')"

        $jobs = @()

        foreach ($targetVmName in $vmNames) {
          $jobs += Start-Job -ScriptBlock {
            param($vmName, $resourceGroup, $adminUsername, $adminPassword, $AzurePAT)

            try {
              Write-Host "Starting agent install on $vmName"
              $scriptblock = {
                param (
                    [string]$vmName,
                    [string]$adminUsername,
                    [string]$adminPassword,
                    [string]$AzurePAT
                )
                # Function to Disable Internet Explorer download protection which breaks the Agent install
                # Windows Server 2025 has retired Internet Explorer, so these Active Setup keys may
                # not exist. Probe before writing - with $ErrorActionPreference = 'Stop' a blind
                # Set-ItemProperty against a missing key would abort the entire agent install.
                function Disable-IEESC {
                  $Keys = @(
                    "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A7-37EF-4b3f-8CFC-4F3A74704073}"
                    "HKLM:\SOFTWARE\Microsoft\Active Setup\Installed Components\{A509B1A8-37EF-4b3f-8CFC-4F3A74704073}"
                  )
                  $Disabled = $false
                  foreach ($Key in $Keys) {
                    if (Test-Path $Key) {
                      Set-ItemProperty -Path $Key -Name "IsInstalled" -Value 0
                      $Disabled = $true
                    }
                  }
                  if ($Disabled) {
                    Stop-Process -Name Explorer -Force -ErrorAction SilentlyContinue
                    Write-Host "IE Enhanced Security Configuration (ESC) has been disabled." -ForegroundColor Green
                  } else {
                    Write-Host "IE ESC keys not present - expected on Windows Server 2025. Nothing to disable." -ForegroundColor Green
                  }
                }

                $ErrorActionPreference = 'Stop'
                # Hoisted out of the agent-download branch below: the Install-Module calls later in
                # this script need TLS 1.2 too, and they run even when the agent is already installed.
                [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
                $poolName = '$(agentPoolName)'
                $org = "VisualLansa"
                # Set true only by the two steps below that change machine-level state the running
                # agent service cannot pick up on its own: registering the agent service, and the
                # pwsh 7 MSI (which alters the machine PATH). Module installs do NOT need a reboot,
                # so a re-run that changes nothing now costs no reboot at all.
                $rebootNeeded = $false
                push-location
                try {
                    Write-Host ("Script echoing vmName = $vmName")

                    $LogFile = "C:\install-log.txt"
                    try {
                      Start-Transcript -Path $LogFile -Force
                    } catch  [System.InvalidOperationException] {
                      stop-transcript -EA Ignore | Out-Null
                      Start-Transcript -Path $LogFile -Force
                    }

                    Disable-IEESC

                    if (-not (Test-Path C:\agent\config.cmd))
                    #if ((Test-Path C:\agent\config.cmd))
                    {
                        Write-Host "Installing agent on: $vmName"

                        # Remove existing agent registration from pool (via REST API)
                        $baseUri = "https://dev.azure.com/$org/_apis"
                        $encodedPAT = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(":$AzurePAT"))
                        $headers = @{ Authorization = "Basic $encodedPAT" }

                        # Get agent pool list
                        Write-Host "Getting list of agent pools..."
                        $relativeUri = "/distributedtask/pools?api-version=7.0"
                        $url = "$baseUri$relativeUri"
                        Write-Host "Calling: $url"

                        try {
                            $poolList = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
                            # Show returned pools
                            $poolList.value | Format-Table id, name | Out-Default | Write-Host
                        } catch {
                            $_ | Out-Default | Write-Host
                            throw
                        }

                        # Find target pool by name
                        $pool = $poolList.value | Where-Object { $_.name -eq $poolName }

                        if (-not $pool) {
                            Write-Host "Agent pool '$poolName' not found."
                            throw
                        }

                        $poolId = $pool.id
                        Write-Host "Found agent pool '$poolName' with ID $poolId"

                        # Get list of agents in that pool
                        $relativeUri = "/distributedtask/pools/$poolId/agents?api-version=7.0"
                        $url = "$baseUri$relativeUri"
                        Write-Host "Calling: $url"

                        try {
                            $agents = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
                            # Display agents neatly
                            $agents.value | Format-Table id, name, version, status, enabled  | Out-Default | Write-Host
                        } catch {
                            $_ | Out-Default | Write-Host
                            throw
                        }

                        # Find agent by VM name
                        $existingAgent = $agents.value | Where-Object { $_.name -eq $vmName }

                        if ($existingAgent) {
                            $agentId = $existingAgent.id
                            Write-Host "Removing existing agent '$vmName' with ID $agentId"

                            $relativeUri = "/distributedtask/pools/$poolId/agents/${agentId}?api-version=7.0"
                            $url = "$baseUri$relativeUri"
                            Write-Host "Calling: $url"

                            try {
                                $delResponse = Invoke-RestMethod -Uri $url -Headers $headers -Method Delete
                                $delResponse | Out-Default | Write-Host
                            } catch {
                                $_ | Out-Default | Write-Host
                                Write-Host "Error removing Agent '$vmName'"
                            }
                            Write-Host "Agent '$vmName' removed"
                        } else {
                            Write-Host "Agent '$vmName' not found in pool. No removal needed."
                        }

                        $AgentInstallUri = "https://download.agent.dev.azure.com/agent/4.269.0/vsts-agent-win-x64-4.269.0.zip"
                        Write-Host "Downloading $AgentInstallUri"
                        # -UseBasicParsing: Windows PowerShell 5.1's Invoke-WebRequest otherwise
                        # initialises the IE DOM parser, which is not present on Windows Server 2025.
                        Invoke-WebRequest -Uri $AgentInstallUri -OutFile c:\agent.zip -UseBasicParsing

                        Write-Host "Extract the Agent install from the zip file"
                        Expand-Archive c:\agent.zip -DestinationPath C:\agent
                        cd C:\agent

                        .\config.cmd --unattended --url https://dev.azure.com/VisualLansa `
                            --auth pat --token $AzurePAT `
                            --pool Default --agent $vmName --acceptTeeEula --runAsService `
                            --windowsLogonAccount $adminUsername --windowsLogonPassword $adminPassword

                        $rebootNeeded = $true
                    } else {
                        Write-Host 'Agent already installed. Skipping.'
                    }

                    Write-Host 'Ensure correct version of Pester'
                    if (Test-Path 'C:\Program Files\WindowsPowerShell\Modules\Pester\3.4.0') {
                        if (Test-Path 'C:\Program Files\WindowsPowerShell\Modules\Pester\3.4.0-disabled') {
                          # 1. Take ownership of the folder and everything inside it recursively (/R)
                          # /D Y automatically selects "Yes" if prompted for confirmation on directories
                          takeown /f "C:\Program Files\WindowsPowerShell\Modules\Pester\3.4.0-disabled" /r /d y

                          # 2. Grant Administrators full control over the folder and all sub-items (/T)
                          # /grant administrators:F gives full control, /c continues on errors
                          icacls "C:\Program Files\WindowsPowerShell\Modules\Pester\3.4.0-disabled" /grant administrators:F /t /c

                          # 3. Forcibly delete the directory and its entire contents
                          Remove-Item -Path "C:\Program Files\WindowsPowerShell\Modules\Pester\3.4.0-disabled" -Force -Recurse
                        }
                        Rename-Item -Path 'C:\Program Files\WindowsPowerShell\Modules\Pester\3.4.0' -NewName '3.4.0-disabled'
                        Write-Host 'Auto-installed Pester version now disabled'
                    } else {
                        Write-Host 'Auto-installed Pester version already disabled. Skipping.'
                    }

                    if (-not (Test-Path 'C:\Program Files\WindowsPowerShell\Modules\Pester\5.6.1')) {
                        Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
                        Install-Module Pester -RequiredVersion 5.6.1 -Scope AllUsers -Force -AllowClobber -SkipPublisherCheck
                        Write-Host 'Correct Pester version now installed.'
                    } else {
                        Write-Host 'Correct Pester version already installed. Skipping.'
                    }

                    Write-Host 'Install working version of AWS Powershell'
                    $AWSModule = Get-InstalledModule -Name AWSPowerShell -ErrorAction Ignore
                    if ( $AWSModule -and $AWSModule.Version -ne '4.1.554') {
                      throw 'AWSPowerShell module must be version 4.1.554. It is currently ${AWSModule.Version}'
                    }
                    if ( -not $AWSModule) {
                      Install-Module -Name AWSPowerShell -RequiredVersion 4.1.554 -AllowClobber -Force | Out-Default | Write-Host
                    }
                    Get-InstalledModule -Name AWSPowerShell | Out-Default | Write-Host

                    Write-Host 'Install AWS CLI'
                    msiexec.exe /i https://awscli.amazonaws.com/AWSCLIV2.msi /qn

                    # Az PowerShell - NOT pinned (unlike AWSPowerShell above, which is pinned because later
                    # versions were broken at the time). This pipeline is how all agents get, and are
                    # upgraded to, the latest Az on every run - the bake's Trusted Launch New-AzVMConfig
                    # -SecurityType needs a current Az.Compute (verified on Az 16.1.0 / Az.Compute 11.7.0).
                    # Log the currently-installed Az versions FIRST so an upgrade can be backed out.
                    Write-Host 'Az PowerShell versions currently installed (logged so this upgrade can be backed out):'
                    Get-InstalledModule -ErrorAction Ignore |
                        Where-Object { $_.Name -eq 'Az' -or $_.Name -like 'Az.*' } |
                        Sort-Object Name, Version | Format-Table Name, Version -AutoSize | Out-Default | Write-Host
                    Write-Host 'Installing / upgrading Az to the latest version...'
                    Install-Module -Name Az -Scope AllUsers -AllowClobber -Force | Out-Default | Write-Host
                    Write-Host 'Az now installed:'
                    Get-InstalledModule -Name Az | Out-Default | Write-Host

                    # --- PowerShell 7 ---------------------------------------------------------
                    # Needed by any task specifying 'pwsh: true'. Not pinned, for the same reason
                    # as Az above: Microsoft-hosted agents track the current stable pwsh, so
                    # tracking it here is what keeps the two kinds of agent interchangeable.
                    #
                    # The modules installed above land in C:\Program Files\WindowsPowerShell\Modules.
                    # pwsh 7 on Windows keeps that directory in its default PSModulePath, so Az and
                    # Pester 5.6.1 load natively under pwsh. AWSPowerShell 4.1.554 is the
                    # Desktop-edition-only module and will only load in pwsh through the Windows
                    # PowerShell compatibility session - so do not convert an AWS task to
                    # 'pwsh: true' without testing it.
                    #
                    # No per-VM gate here any more: this whole script only runs on the VMs named
                    # in targetVmNames, so reaching this point already means pwsh is wanted.
                    $pwshMinimumVersion = [version]'$(pwshMinimumVersion)'
                    $pwshExe = Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe'
                    $pwshFound = $null
                    if (Test-Path $pwshExe) {
                      # Ask the binary rather than trusting the install path - a failed or partial
                      # upgrade can leave pwsh.exe present but older than requested.
                      try {
                        $pwshFound = [version](& $pwshExe -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')
                      } catch {
                        Write-Host 'pwsh.exe present but would not report its version; reinstalling.'
                      }
                    }

                    if ($pwshFound -and $pwshFound -ge $pwshMinimumVersion) {
                        Write-Host "PowerShell $pwshFound already installed, minimum is $pwshMinimumVersion. Skipping."
                    } else {
                        Write-Host "Installing PowerShell 7 (minimum $pwshMinimumVersion)"
                        # Microsoft's official installer: resolves the latest stable release,
                        # downloads the MSI, and waits for msiexec to finish - unlike the fire-and-
                        # forget 'msiexec /i <url>' used for the AWS CLI above, which is why the
                        # version check below can be trusted immediately.
                        $pwshInstaller = Join-Path $env:TEMP 'install-powershell.ps1'
                        Invoke-WebRequest -Uri 'https://aka.ms/install-powershell.ps1' -OutFile $pwshInstaller -UseBasicParsing
                        & $pwshInstaller -UseMSI -Quiet

                        if (-not (Test-Path $pwshExe)) {
                            throw "PowerShell 7 install completed but $pwshExe does not exist."
                        }
                        $pwshNow = [version](& $pwshExe -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')
                        if ($pwshNow -lt $pwshMinimumVersion) {
                            throw "Installed PowerShell $pwshNow is below the required minimum $pwshMinimumVersion."
                        }
                        Write-Host "PowerShell $pwshNow installed."
                        # The MSI adds pwsh to the machine PATH, but the already-running agent
                        # service holds the environment it started with, and the agent only
                        # publishes its 'pwsh' capability at startup. The reboot below is what makes
                        # both take effect - pwsh will NOT work before it.
                        Write-Host 'pwsh will not be usable by the agent service until this VM reboots.'
                        $rebootNeeded = $true
                    }

                    # --- Reboot -----------------------------------------------------------------
                    # Last statement of the try, so a failed install never reboots - the catch below
                    # rethrows first. This used to be a second, sequential Invoke-AzVMRunCommand
                    # pass over every VM after all the install jobs had finished, costing ~10 min.
                    # Here it rides on the existing Start-Job-per-VM fan-out, so all the reboots
                    # overlap and each VM reboots as soon as its own install succeeds.
                    #
                    # shutdown.exe, NOT Restart-Computer: this returns immediately and schedules the
                    # reboot, so the RunCommand extension can report its output and the finally block
                    # can close the transcript. Restart-Computer -Force kills the machine while
                    # RunCommand is still reporting, and its -Delay is not a pre-reboot grace period
                    # (it is the polling interval used with -Wait, which is itself meaningless when
                    # the waiting process is on the machine being rebooted).
                    if ($rebootNeeded) {
                        Write-Host "Scheduling reboot of $vmName in 60 seconds to complete installation..."
                        shutdown.exe /r /t 60 /c "Reboot to complete Azure DevOps agent installation"
                    } else {
                        Write-Host "Nothing installed on $vmName needs a reboot. Skipping reboot."
                    }
                } catch {
                    $_ | Out-Default | Write-Host
                    throw
                } finally {
                    Stop-Transcript -ErrorAction Ignore | Out-Null
                    pop-location
                }
              } # Install Script Block

              $Script = [scriptblock]::create($ScriptBlock)
              $result = Invoke-AzVMRunCommand -ResourceGroupName $resourceGroup -Name $vmName -CommandId 'RunPowerShellScript' -ScriptString $script `
                -Parameter @{ vmName=$vmName; adminUsername=$adminUsername; adminPassword=$adminPassword; AzurePAT=$AzurePAT }
              $result.Value | ForEach-Object { Write-Host "[$vmName] $($_.Message)" }

            } catch {
              $_ | Out-Default | Write-Host
              exit 1
              throw
            } # Job Script Block

          } -ArgumentList $targetVmName, $resourceGroup, $adminUsername, $adminPassword, $AzurePAT
        } # Job loop

        Write-Host "Waiting for all agent install jobs..."
        foreach ($job in $jobs) {
          try {
              $output = Receive-Job -Job $job -Wait -AutoRemoveJob -ErrorAction Continue
              Write-Host "Job Output:"
              $output | Out-Default | Write-Host
          } catch {
              Write-Host "Caught exception from job:"
              $_ | Out-Default | Write-Host
              throw
          }

          if ($job.State -eq 'Failed') {
              $err = $job.ChildJobs[0].JobStateInfo.Reason
              Write-Host "Job failed with reason:"
              $err | Out-Default | Write-Host
              throw
          }
        }
        # Each VM now schedules its own reboot at the end of its install script, inside the parallel
        # job above - see the 'Reboot' comment there. The reboots are therefore already in flight and
        # will complete about a minute after the job that triggered them, rather than needing a
        # second sequential pass over all $vmCount VMs from here.
        Write-Host "All agent installs complete. Any VM that needed a reboot has scheduled its own."
